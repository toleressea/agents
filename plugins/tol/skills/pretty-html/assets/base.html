<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --bg:#0b0d10; --panel:#161a21; --raise:#1c212a; --line:#232934; --text:#d7dce4; --dim:#8b95a5;
          --accent:#58a6ff; --ok:#3fb950; --bad:#f85149; --warn:#d29922; --you:#c38cff; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 16px 48px; background:var(--bg); color:var(--text); font:14px/1.6 ui-sans-serif,system-ui,Segoe UI,sans-serif; }
  main { max-width:1000px; margin:0 auto; }
  h1 { font-size:24px; margin:0 0 4px; } h2 { font-size:18px; margin:28px 0 8px; } h3 { font-size:15px; margin:18px 0 6px; }
  .lede { color:var(--dim); margin:0 0 18px; }
  a { color:var(--accent); } code, pre { font:12.5px/1.5 ui-monospace,Consolas,monospace; background:#0b0d10; border-radius:4px; }
  code { padding:1px 5px; } pre { padding:10px 12px; overflow:auto; border:1px solid var(--line); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin:14px 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 16px; }
  .stat .v { font-size:26px; font-weight:650; } .stat .k { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  table { width:100%; border-collapse:collapse; font-size:13px; } th { color:var(--dim); font-weight:600; text-align:left; }
  td, th { padding:6px 8px; border-top:1px solid var(--line); vertical-align:top; }
  .tag { display:inline-block; font-size:11px; padding:0 7px; border-radius:9px; border:1px solid currentColor; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); } .dim { color:var(--dim); } .acc { color:var(--accent); }
  .callout { border-left:3px solid var(--warn); background:var(--raise); padding:8px 12px; border-radius:0 6px 6px 0; margin:12px 0; }
  .callout.info { border-color:var(--accent); } .callout.bad { border-color:var(--bad); } .callout.ok { border-color:var(--ok); }
  details summary { cursor:pointer; color:var(--dim); } ul, ol { padding-left:22px; } li { margin:3px 0; }
  nav.toc { color:var(--dim); font-size:13px; } nav.toc a { color:var(--dim); margin-right:12px; }
  footer { color:var(--dim); font-size:12px; margin-top:40px; }
</style></head><body><main>
<h1>__TITLE__</h1>
<p class="lede">__LEDE__</p>
<!-- body: sections, cards, tables, stat grids, callouts -->
<footer>🤖 Generated with stochastic optimism by clankers 🤖</footer>
</main></body></html>
