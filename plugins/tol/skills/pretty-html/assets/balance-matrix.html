<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<!--
  Balance matrix: rows of things (enemies, weapons, items) x shared numeric columns, drawn as bars scaled
  to each column's maximum and coloured low (blue) to high (yellow). Edit mode turns each cell into a
  slider; bars rescale live, formula columns recompute, and Export writes the changed source fields.
  Fill __TITLE__, __LEDE__, __SLUG__ and __DATA__ (JSON, contract below). See SKILL.md "Balance matrix".

  __DATA__ = {
    "sections": ["Recruit", "Pilot", ...],            // row groups, in order (optional)
    "columns": [
      {"k": "hp", "l": "HP", "h": "toughness", "u": "", "step": 1, "min": 1, "max": 600},   // max optional (default 2x the column max)
      {"k": "dps", "l": "Damage / s", "h": "computed", "u": "/s", "formula": "hit * rate"} // computed, read-only
    ],
    "rows": [{
      "id": "Grunt", "name": "Grunt", "section": "Tier 1",
      "sub": "threat 1",                        // small line under the name (optional)
      "chips": ["turn cap", "stationary"],                 // optional
      "base": {"nested": 25},                              // extra constants formulas can read (optional)
      "cells": {
        "hp":  {"v": 20, "field": {"asset": "Assets/.../Grunt.prefab", "component": "Health", "name": "hp"}},
        "turn": {"v": 2.83, "toField": "170 / x", "field": {...}},  // the slider shows x; Export writes toField(x)
        "rate": {"v": 0.5, "toField": "1 / x", "field": {...}},
        "range": {"v": 10}                                 // no field = shown, no slider
      }
    }]
  }
  A missing cell is drawn as "—". Formula columns use the other columns' keys plus "base" values.
-->
<style>
  :root { --bg:#0b0d10; --panel:#161a21; --raise:#1c212a; --line:#232934; --text:#d7dce4; --dim:#8b95a5; --edit:#ffa657; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 16px 48px; background:var(--bg); color:var(--text); font:14px/1.6 ui-sans-serif,system-ui,Segoe UI,sans-serif; }
  main { max-width:1560px; margin:0 auto; }
  h1 { font-size:24px; margin:0 0 4px; }
  .lede { color:var(--dim); margin:0 0 18px; max-width:1050px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin:14px 0; }
  footer { color:var(--dim); font-size:12px; margin-top:40px; }
  .controls { display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin:6px 0 10px; color:var(--dim); font-size:13px; }
  .controls label { display:flex; gap:6px; align-items:center; cursor:pointer; }
  .controls button { background:var(--raise); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:3px 12px; cursor:pointer; font:inherit; }
  .controls button.primary { border-color:var(--edit); color:var(--edit); }
  .legend { display:inline-flex; align-items:center; gap:8px; }
  .legend .ramp { width:120px; height:10px; border-radius:3px; background:linear-gradient(90deg,#3b528b,#21918c,#5ec962,#fde725); }
  .scroll { overflow-x:auto; }
  table.m { width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; min-width:1100px; }
  table.m th { position:sticky; top:0; background:var(--panel); z-index:2; cursor:pointer; user-select:none; font-size:12px; line-height:1.25; vertical-align:bottom; color:var(--dim); font-weight:600; text-align:left; padding:6px 8px; }
  table.m th .hint { display:block; font-weight:400; font-size:11px; }
  table.m th.sorted { color:var(--text); }
  table.m th:first-child { width:220px; cursor:default; }
  table.m td { padding:5px 8px; border-top:1px solid var(--line); vertical-align:middle; }
  tr.sec td { color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:.06em; font-size:11px; padding-top:14px; border-top:none; }
  td.name b { font-weight:600; }
  td.name .sub { display:block; color:var(--dim); font-size:11px; line-height:1.3; }
  .bar { position:relative; height:12px; background:#0f1318; border-radius:3px; }
  .bar i { position:absolute; left:0; top:0; bottom:0; border-radius:3px; }
  .bar i.over { box-shadow:inset -6px 0 0 rgba(255,255,255,.55); }
  .bar .orig { position:absolute; top:-3px; bottom:-3px; width:2px; background:#fff; opacity:.75; display:none; }
  td.edited .bar .orig { display:block; }
  .num { font-size:10.5px; color:var(--dim); display:none; line-height:1.2; margin-top:2px; }
  body.nums .num, body.editing .num { display:block; }
  td.edited .num { color:var(--edit); }
  input[type=range] { width:100%; margin:3px 0 0; height:14px; accent-color:var(--edit); display:none; }
  body.editing input[type=range] { display:block; }
  .none { color:#3a4250; font-size:11px; }
  .ro { font-size:10px; color:#4a5463; display:none; }
  body.editing .ro { display:block; }
  .chip { font-size:10.5px; padding:0 6px; border-radius:8px; border:1px solid var(--line); color:var(--dim); margin-right:4px; white-space:nowrap; }
  .chip.edit { color:var(--edit); border-color:#6b4a2a; }
  #tip { position:fixed; pointer-events:none; background:#0e1217; border:1px solid var(--line); border-radius:6px; padding:7px 10px; font-size:12px; max-width:330px; display:none; z-index:10; box-shadow:0 4px 18px rgba(0,0,0,.5); }
  #tip b { color:#fff; }
  #exportBox { display:none; width:100%; height:200px; background:#0b0d10; color:var(--text); border:1px solid var(--line); border-radius:6px; font:12px/1.5 ui-monospace,Consolas,monospace; margin-top:8px; }
  #changeCount { color:var(--edit); }
</style></head><body><main>
<h1>__TITLE__</h1>
<p class="lede">__LEDE__</p>
<div class="card">
<div class="controls">
  <label><input type="checkbox" id="edit"> <b>Edit</b></label>
  <label><input type="checkbox" id="nums"> Show numbers</label>
  <button id="regroup">Group</button>
  <button id="undo">Reset all edits</button>
  <button id="export" class="primary">Export changes</button>
  <span id="changeCount"></span>
  <span class="legend">lowest <span class="ramp"></span> highest in its column</span>
</div>
<textarea id="exportBox" readonly></textarea>
<div class="scroll"><table class="m" id="m"></table></div>
</div>
<!-- extra sections (notes, sources) go here -->
<footer>🤖 Generated with stochastic optimism by clankers 🤖</footer>
</main>
<div id="tip"></div>
<script>
const DATA = __DATA__;
const SLUG = "__SLUG__";
const STORE = "balanceMatrix:" + SLUG;
const COLS = DATA.columns, ROWS = DATA.rows, SECTIONS = DATA.sections || [];
const RAMP = [[59,82,139],[33,145,140],[94,201,98],[253,231,37]];
const fn = src => new Function("x", "f", `return (${src});`);
for (const r of ROWS) for (const k in r.cells) { const c = r.cells[k]; c.o = c.v; }

function value(r, k, orig) {
  const col = COLS.find(c => c.k === k);
  if (col.formula) {
    const scope = Object.assign({}, r.base || {});
    for (const c of COLS) if (!c.formula && r.cells[c.k]) scope[c.k] = orig ? r.cells[c.k].o : r.cells[c.k].v;
    try { const v = new Function(...Object.keys(scope), `return (${col.formula});`)(...Object.values(scope)); return Number.isFinite(v) ? v : null; }
    catch (e) { return null; }
  }
  const cell = r.cells[k];
  return cell ? (orig ? cell.o : cell.v) : null;
}
const edited = (r, k) => {
  const col = COLS.find(c => c.k === k);
  if (col.formula) return COLS.some(c => !c.formula && r.cells[c.k] && col.formula.includes(c.k) && r.cells[c.k].v !== r.cells[c.k].o);
  const c = r.cells[k]; return !!c && Math.abs(c.v - c.o) > 1e-9;
};
function fmt(v) { return v == null ? "—" : (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100).toString(); }
function rampColor(t) {
  t = Math.max(0, Math.min(1, t)) * (RAMP.length - 1);
  const i = Math.min(RAMP.length - 2, Math.floor(t)), f = t - i, a = RAMP[i], b = RAMP[i + 1];
  return `rgb(${a.map((x, j) => Math.round(x + (b[j] - x) * f)).join(",")})`;
}
function colMax(k) { let m = 1e-9; for (const r of ROWS) { const v = value(r, k); if (v != null && v > m) m = v; } return m; }
function sliderMax(c) { if (c.max) return c.max; let m = 0; for (const r of ROWS) { const v = value(r, c.k, true); if (v != null && v > m) m = v; } return Math.max(m * 2, (c.min || 0) * 4, 1); }

try { const s = JSON.parse(localStorage.getItem(STORE) || "{}"); for (const r of ROWS) for (const k in (s[r.id] || {})) if (r.cells[k]) r.cells[k].v = s[r.id][k]; } catch (e) {}
function save() { const o = {}; for (const r of ROWS) for (const k in r.cells) if (edited(r, k)) (o[r.id] ??= {})[k] = r.cells[k].v; localStorage.setItem(STORE, JSON.stringify(o)); }

let sortKey = null, sortDir = -1;
function chips(r) { return (r.chips || []).map(c => `<span class="chip">${c}</span>`).join("") + (Object.keys(r.cells).some(k => edited(r, k)) ? `<span class="chip edit">edited</span>` : ""); }
function rowHtml(r) {
  let h = `<tr data-r="${r.id}"><td class="name"><b>${r.name}</b> <span class="chips">${chips(r)}</span>${r.sub ? `<span class="sub">${r.sub}</span>` : ""}</td>`;
  for (const c of COLS) {
    if (value(r, c.k) == null) { h += `<td><span class="none">—</span></td>`; continue; }
    const cell = r.cells[c.k], can = !c.formula && cell && cell.field;
    const slider = can ? `<input type="range" min="${c.min ?? 0}" max="${sliderMax(c)}" step="${c.step ?? "any"}" value="${cell.v}" data-r="${r.id}" data-c="${c.k}">` : `<span class="ro">${c.formula ? "computed" : "no slider"}</span>`;
    h += `<td data-r="${r.id}" data-c="${c.k}"><div class="bar"><i></i><span class="orig"></span></div><span class="num"></span>${slider}</td>`;
  }
  return h + "</tr>";
}
function build() {
  let h = "<thead><tr><th>" + (DATA.rowLabel || "Name") + "</th>" + COLS.map(c => `<th data-k="${c.k}" class="${sortKey === c.k ? "sorted" : ""}">${c.l}${sortKey === c.k ? (sortDir < 0 ? " ▼" : " ▲") : ""}<span class="hint">${c.h || ""}</span></th>`).join("") + "</tr></thead><tbody>";
  if (sortKey || !SECTIONS.length) {
    const rs = sortKey ? [...ROWS].sort((a, b) => sortDir * ((value(a, sortKey) ?? -1) - (value(b, sortKey) ?? -1))) : ROWS;
    h += rs.map(rowHtml).join("");
  } else for (const s of SECTIONS) {
    const rs = ROWS.filter(r => r.section === s); if (!rs.length) continue;
    h += `<tr class="sec"><td colspan="${COLS.length + 1}">${s}</td></tr>` + rs.map(rowHtml).join("");
  }
  document.getElementById("m").innerHTML = h + "</tbody>";
  document.querySelectorAll("#m th[data-k]").forEach(th => th.onclick = () => { if (sortKey === th.dataset.k) sortDir = -sortDir; else { sortKey = th.dataset.k; sortDir = -1; } build(); });
  refresh();
}
function refresh() {
  const mx = {}; for (const c of COLS) mx[c.k] = colMax(c.k);
  document.querySelectorAll("#m td[data-c]").forEach(td => {
    const r = ROWS.find(x => x.id === td.dataset.r), c = COLS.find(x => x.k === td.dataset.c);
    const v = value(r, c.k), o = value(r, c.k, true), pct = Math.min(100, v / mx[c.k] * 100), over = v > mx[c.k] * 1.0001;
    const i = td.querySelector(".bar i");
    i.style.width = Math.max(pct, v > 0 ? 2 : 0) + "%"; i.style.background = rampColor(pct / 100); i.className = over ? "over" : "";
    if (o != null) td.querySelector(".orig").style.left = Math.min(100, o / mx[c.k] * 100) + "%";
    const e = edited(r, c.k); td.classList.toggle("edited", e);
    td.querySelector(".num").textContent = fmt(v) + (c.u || "") + (e ? `  (was ${fmt(o)})` : "");
  });
  document.querySelectorAll("#m tr[data-r]").forEach(tr => tr.querySelector(".chips").innerHTML = chips(ROWS.find(x => x.id === tr.dataset.r)));
  const n = changes().length; document.getElementById("changeCount").textContent = n ? `${n} field${n > 1 ? "s" : ""} changed` : "";
}
function changes() {
  const out = [];
  for (const r of ROWS) for (const k in r.cells) {
    const c = r.cells[k]; if (!c.field || !edited(r, k)) continue;
    const to = c.toField ? fn(c.toField)(c.v) : c.v, from = c.toField ? fn(c.toField)(c.o) : c.o;
    const round = v => Math.round(v * 1000) / 1000;
    out.push({row: r.name, column: k, ...c.field, from: round(from), to: round(to)});
  }
  return out;
}
document.getElementById("export").onclick = () => {
  const ch = changes(), payload = JSON.stringify({exported: new Date().toISOString(), changes: ch}, null, 1);
  const box = document.getElementById("exportBox"); box.value = ch.length ? payload : "No changes yet."; box.style.display = "block";
  if (!ch.length) return;
  navigator.clipboard?.writeText(payload).catch(() => {});
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([payload], {type: "application/json"})); a.download = SLUG + "-changes.json"; a.click();
};
const m = document.getElementById("m"), tip = document.getElementById("tip");
m.addEventListener("input", e => { const s = e.target; if (s.type !== "range") return; ROWS.find(x => x.id === s.dataset.r).cells[s.dataset.c].v = parseFloat(s.value); save(); refresh(); });
m.addEventListener("mousemove", e => {
  const td = e.target.closest("td[data-c]"); if (!td || e.target.type === "range") { tip.style.display = "none"; return; }
  const r = ROWS.find(x => x.id === td.dataset.r), c = COLS.find(x => x.k === td.dataset.c), cell = r.cells[c.k];
  const f = cell && cell.field ? `${cell.field.component ? cell.field.component + "." : ""}${cell.field.name}` : (c.formula ? "computed: " + c.formula : "");
  tip.innerHTML = `<b>${r.name}</b> · ${c.l}<br><span style="font-size:15px">${fmt(value(r, c.k))}${c.u || ""}</span>${edited(r, c.k) ? ` <span style="color:#8b95a5">(was ${fmt(value(r, c.k, true))})</span>` : ""}${cell && cell.note ? `<br><span style="color:#8b95a5">${cell.note}</span>` : ""}${f ? `<br><span style="color:#8b95a5;font-size:11px">${f}</span>` : ""}`;
  tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 14, innerWidth - 340) + "px"; tip.style.top = (e.clientY + 14) + "px";
});
m.addEventListener("mouseleave", () => tip.style.display = "none");
document.getElementById("edit").onchange = e => document.body.classList.toggle("editing", e.target.checked);
document.getElementById("nums").onchange = e => document.body.classList.toggle("nums", e.target.checked);
document.getElementById("regroup").onclick = () => { sortKey = null; build(); };
document.getElementById("undo").onclick = () => { if (!confirm("Reset every edit?")) return; for (const r of ROWS) for (const k in r.cells) r.cells[k].v = r.cells[k].o; localStorage.removeItem(STORE); build(); };
build();
</script>
</body></html>
